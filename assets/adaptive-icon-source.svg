<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="100%" stop-color="#F0E4CC"/>
    </linearGradient>
    <linearGradient id="coverLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B6032"/>
      <stop offset="100%" stop-color="#A07040"/>
    </linearGradient>
    <linearGradient id="coverRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A07040"/>
      <stop offset="100%" stop-color="#8B6032"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A5025"/>
      <stop offset="100%" stop-color="#6B4420"/>
    </linearGradient>
  </defs>

  <!-- Book group -->
  <g transform="translate(512, 500)">

    <!-- Spine -->
    <rect x="-20" y="-240" width="40" height="480" rx="4" fill="url(#spine)"/>

    <!-- Left cover -->
    <path d="M-20,-240 L-260,-210 L-260,260 L-20,240 Z" fill="url(#coverLeft)" stroke="#6B4420" stroke-width="3"/>

    <!-- Right cover -->
    <path d="M20,-240 L260,-210 L260,260 L20,240 Z" fill="url(#coverRight)" stroke="#6B4420" stroke-width="3"/>

    <!-- Left pages -->
    <path d="M-15,-230 L-240,-205 L-240,250 L-15,230 Z" fill="url(#page)"/>

    <!-- Right pages -->
    <path d="M15,-230 L240,-205 L240,250 L15,230 Z" fill="url(#page)"/>

    <!-- Page lines left -->
    <line x1="-230" y1="-190" x2="-20" y2="-215" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="-155" x2="-20" y2="-180" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="-120" x2="-20" y2="-145" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="-85" x2="-20" y2="-110" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="-50" x2="-20" y2="-75" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="-15" x2="-20" y2="-40" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="20" x2="-20" y2="-5" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="55" x2="-20" y2="30" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="90" x2="-20" y2="65" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="125" x2="-20" y2="100" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="160" x2="-20" y2="135" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="-230" y1="195" x2="-20" y2="170" stroke="#D4C4A8" stroke-width="2"/>

    <!-- Page lines right -->
    <line x1="20" y1="-215" x2="230" y2="-190" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="-180" x2="230" y2="-155" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="-145" x2="230" y2="-120" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="-110" x2="230" y2="-85" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="-75" x2="230" y2="-50" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="-40" x2="230" y2="-15" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="-5" x2="230" y2="20" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="30" x2="230" y2="55" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="65" x2="230" y2="90" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="100" x2="230" y2="125" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="135" x2="230" y2="160" stroke="#D4C4A8" stroke-width="2"/>
    <line x1="20" y1="170" x2="230" y2="195" stroke="#D4C4A8" stroke-width="2"/>

    <!-- Cross on left page -->
    <g transform="translate(-130, -130) scale(1.8)">
      <rect x="-4" y="-20" width="8" height="40" rx="2" fill="#8B6032" opacity="0.3"/>
      <rect x="-15" y="-6" width="30" height="8" rx="2" fill="#8B6032" opacity="0.3"/>
    </g>

    <!-- Ribbon bookmark -->
    <path d="M15,-230 Q40,-180 30,-100 Q25,-60 15,-20" fill="#C0392B" stroke="#A93226" stroke-width="2"/>
    <path d="M15,-230 L15,-20" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>

  </g>
</svg>
